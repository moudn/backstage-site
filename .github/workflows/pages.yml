# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Nothing built is committed to the repository: the workflow runs the same
# `npm run build` you run locally and hands dist/ straight to Pages. A
# committed dist/ goes stale the first time someone edits source and forgets
# to rebuild, and then the live site quietly disagrees with the code.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so a deploy can
      # never pick up a different dependency version than the one tested.
      - run: npm ci

      - run: npm run build
        env:
          # Set these in Settings -> Secrets and variables -> Actions ->
          # Variables. Unset, the contact form falls back to opening the
          # visitor's mail client. See .env.example.
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_FORM_KEY: ${{ vars.VITE_FORM_KEY }}

      # `enablement: true` turns Pages on via the API if it isn't already,
      # rather than failing with "Get Pages site failed" and waiting for
      # somebody to find the setting. It needs the `pages: write` permission
      # granted above; without it this silently reverts to just reading.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
